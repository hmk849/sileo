name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for device
        run: |
          xcodebuild -project Sileo.xcodeproj -scheme Sileo \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO -derivedDataPath /tmp/dd
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R /tmp/dd/Build/Products/Release-iphoneos/Sileo.app Payload/
          zip -r -q Sileo-unsigned.ipa Payload
          ls -la Sileo-unsigned.ipa
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create "${GITHUB_REF_NAME}" Sileo-unsigned.ipa \
            --title "Sileo ${GITHUB_REF_NAME}" \
            --notes "Sileo iOS 仿真应用（纯本地模拟，不安装真实 Deb），未签名 IPA，LCSign 普通证书签"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
