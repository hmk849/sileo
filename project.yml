name: Sileo
options:
  bundleIdPrefix: com.hmk849
  deploymentTarget:
    iOS: "17.0"
packages:
  LiquidGlass:
    url: https://github.com/rguillen-dev/LiquidGlass
    branch: main
targets:
  Sileo:
    type: application
    platform: iOS
    sources: [Sileo]
    dependencies:
      - package: LiquidGlass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hmk849.sileo
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sileo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
